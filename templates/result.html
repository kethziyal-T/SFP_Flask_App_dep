<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnostic Results</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="dashboard-header">
            <h1>Diagnostic Output</h1>
            <p class="subtitle">System anomaly assessment results</p>
        </header>

        <!-- Result Card with Conditional Dynamic Alert Status Blocks -->
        <main class="card result-card">
            <div class="alert {{ alert_type }}">
                <div class="status-graphic">
                    {% if alert_type == 'healthy-alert' %}
                        <!-- Embedded Healthy System SVG Block -->
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                            <polyline points="22 4 12 14.01 9 11.01"></polyline>
                        </svg>
                    {% else %}
                        <!-- Embedded Fault Alert SVG Block -->
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                            <line x1="12" y1="9" x2="12" y2="13"></line>
                            <line x1="12" y1="17" x2="12.01" y2="17"></line>
                        </svg>
                    {% endif %}
                </div>
                <h2>{{ prediction_text }}</h2>
            </div>

            <div class="action-footer">
                <a href="/" class="btn btn-secondary">Return to Diagnostics</a>
            </div>
        </main>
    </div>
</body>
</html>
